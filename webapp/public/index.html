<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BESTメディア ダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css?v=231">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
</head>
<body>
<div class="app" id="app" hidden>
  <nav class="nav" aria-label="メインメニュー">
    <div class="ui-preview" id="ui-preview" hidden><label for="ui-preview-select">UI確認</label><select id="ui-preview-select"><option value="">通常の画面（管理者）</option></select></div>
    <div class="brand"><b>BEST MEDIA</b></div>
    <div class="bm-list" id="bm-list" hidden></div>
    <div class="dash-switch">
      <label for="dash-select">ダッシュボード</label>
      <select id="dash-select">
        <option value="media">メディア数値</option>
        <option value="articles">コンテンツ作成</option>
        <option value="rewards">報酬管理</option>
        <option value="expenses">支出情報</option>
        <option value="revenue">収益情報</option>
        <option value="goals">目標・工数</option>
        <option value="ai">AIツール</option>
      </select>
    </div>
    <div>
      <ul id="nav-analysis"></ul>
    </div>
    <div id="nav-admin-wrap" hidden>
      <h3>BEST MEDIA管理</h3>
      <ul id="nav-admin"></ul>
    </div>
    <div id="nav-admin-all-wrap" hidden>
      <h3>全体管理</h3>
      <ul id="nav-admin-all"></ul>
    </div>
    <div class="nav-foot">
      <div class="status"><span class="dot" id="status-dot"></span><span id="status-text">読み込み中…</span></div>
      <div>データ保存先：BigQuery</div>
    </div>
  </nav>

  <div class="main">
    <header class="topbar">
      <h1 id="page-title">サマリ</h1>
      <label class="field" id="art-media-field" hidden>メディア
        <select id="art-media-select"></select>
      </label>
      <label class="field" id="art-sub-field" hidden>ディレクトリ
        <select id="art-sub-select"></select>
      </label>
      <label class="field" id="media-field">メディア
        <select id="media-select"></select>
      </label>
      <div class="seg" id="mode-seg" role="group" aria-label="表示切替">
        <button type="button" data-mode="single" aria-pressed="true">選択メディア</button>
        <button type="button" data-mode="compare" aria-pressed="false">各メディア比較</button>
      </div>
      <button class="bm-add" id="bm-add" type="button" title="今の画面と表示設定をブックマーク（5つまで）">★ ブックマーク</button>
      <span class="ver-badge" id="app-ver" title="バージョン"></span>
      <div class="user-chip"><span class="avatar" id="avatar"></span><span id="user-name"></span><button class="linkbtn" id="logout" type="button">ログアウト</button></div>
    </header>
    <div class="preview-banner" id="preview-banner" hidden></div>
    <main class="content" id="content"><p class="loading">読み込み中…</p></main>
  </div>
</div>

<div class="modal-back" id="modal" hidden></div>

<div class="login" id="login" hidden>
  <form class="login-card" id="login-form" novalidate>
    <h1>BEST MEDIA ダッシュボード</h1>
    <p class="note" id="login-lead">管理者が追加した Googleアカウントでログインしてください。</p>
    <button class="btn" type="button" id="login-google">Googleアカウントでログイン</button>
    <div hidden><!-- ログインは Googleアカウントだけ（2026-10-28 ユーザー指定） -->
    <label>メールアドレス<input id="login-email" type="email" autocomplete="username" required></label>
    <label>パスワード<input id="login-pass" type="password" autocomplete="current-password" required minlength="8"></label>
    <p class="err" id="login-err" hidden></p>
    <button class="btn primary" type="submit" id="login-submit">ログイン</button>
    <div class="row" style="justify-content: space-between;">
      <button class="linkbtn" type="button" id="login-toggle">新規登録はこちら</button>
      <button class="linkbtn" type="button" id="login-reset">パスワードを忘れた場合</button>
    </div>
    </div>
  </form>
</div>

<div class="login" id="waiting" hidden>
  <div class="login-card">
    <h1 id="waiting-title">承認待ちです</h1>
    <p class="note" id="waiting-text">登録を受け付けました。管理者が承認すると使えるようになります。承認後に、このページを再読み込みしてください。</p>
    <p class="note" id="waiting-email"></p>
    <div class="row"><button class="btn" type="button" id="waiting-reload">再読み込み</button><button class="linkbtn" type="button" id="waiting-logout">ログアウト</button></div>
  </div>
</div>

<script src="/app.js?v=556"></script>
</body>
</html>
