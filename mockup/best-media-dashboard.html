<title>BESTメディア ダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
/* Layout: 左に固定ナビ（分析タブ＋管理）、右に「操作バー → KPI → グラフ → 表」の順で縦に積む業務ダッシュボード */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --surface-2: #eef2f0;
  --fg: #17211d;
  --muted: #5d6b65;
  --line: #d9e0dc;
  --nav: #13302a;
  --nav-fg: #d6e4de;
  --nav-active: #2f7d68;
  --accent: #1f6f5c;
  --accent-soft: #dcefe8;
  --good: #1d7a4a;
  --good-soft: #def3e6;
  --bad: #b23a3a;
  --bad-soft: #f8e1e0;
  --warn: #9a6a00;
  --warn-soft: #fbf0d4;
  --grid: rgba(23, 33, 29, .08);
  --font-display: "Zen Kaku Gothic New", "Noto Sans JP", system-ui, sans-serif;
  --font-body: "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --s1: #1f6f5c; --s2: #d0743c; --s3: #3d6fb6; --s4: #a4507e; --s5: #7a8f2e;
  --s6: #b8912a; --s7: #4d9aa6; --s8: #8a5a3c; --s9: #6b5fb5; --s10: #c25469;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --surface: #161e1b; --surface-2: #1c2622; --fg: #e3ebe7; --muted: #95a59e; --line: #2a3632;
    --nav: #0a110f; --nav-fg: #b9cbc3; --nav-active: #2f7d68; --accent: #5cc3a3; --accent-soft: #1d3a31;
    --good: #5fcf8f; --good-soft: #17352a; --bad: #f08a83; --bad-soft: #3d1f1e; --warn: #e6b84d; --warn-soft: #3a2f14;
    --grid: rgba(227, 235, 231, .08);
    --s1: #5cc3a3; --s2: #f0a06c; --s3: #7fa8e6; --s4: #d88ab4; --s5: #b5cc63;
    --s6: #e6c35c; --s7: #7cc9d4; --s8: #c99a77; --s9: #a69ae6; --s10: #ec8fa1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #161e1b; --surface-2: #1c2622; --fg: #e3ebe7; --muted: #95a59e; --line: #2a3632;
  --nav: #0a110f; --nav-fg: #b9cbc3; --nav-active: #2f7d68; --accent: #5cc3a3; --accent-soft: #1d3a31;
  --good: #5fcf8f; --good-soft: #17352a; --bad: #f08a83; --bad-soft: #3d1f1e; --warn: #e6b84d; --warn-soft: #3a2f14;
  --grid: rgba(227, 235, 231, .08);
  --s1: #5cc3a3; --s2: #f0a06c; --s3: #7fa8e6; --s4: #d88ab4; --s5: #b5cc63;
  --s6: #e6c35c; --s7: #7cc9d4; --s8: #c99a77; --s9: #a69ae6; --s10: #ec8fa1;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.6; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.nav { background: var(--nav); color: var(--nav-fg); padding-block: 18px; padding-inline: 12px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; }
.brand { display: flex; flex-direction: column; gap: 2px; padding-inline: 8px; }
.brand b { font-family: var(--font-display); font-size: 17px; color: #fff; letter-spacing: .02em; }
.brand span { font-size: 11px; opacity: .7; }
.nav h3 { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; opacity: .55; padding-inline: 8px; margin: 0 0 6px; font-weight: 500; }
.nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.nav button { width: 100%; text-align: left; background: none; border: 0; color: inherit; padding: 8px 10px; border-radius: 8px; display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
.nav button:hover { background: rgba(255,255,255,.06); }
.nav button[aria-current="page"] { background: var(--nav-active); color: #fff; }
.nav .ico { width: 18px; height: 18px; flex: none; opacity: .9; }
.nav .tag { margin-left: auto; font-size: 10px; padding: 1px 6px; border-radius: 99px; background: rgba(255,255,255,.12); }
.nav-foot { margin-top: auto; font-size: 11.5px; padding-inline: 8px; display: flex; flex-direction: column; gap: 6px; }
.nav-foot .status { display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 14px; padding-inline: 24px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.topbar h1 { font-family: var(--font-display); font-size: 19px; margin: 0; margin-right: auto; text-wrap: balance; }
.proto { font-size: 11px; color: var(--warn); background: var(--warn-soft); padding: 2px 8px; border-radius: 99px; }
.field { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.field select, .field input { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 13px; color: var(--fg); max-width: 100%; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; font-size: 12.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 500; }
.user-chip { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.linkbtn { background: none; border: 0; color: var(--accent); font-size: 12px; padding: 0; }

.content { padding-block: 22px 48px; padding-inline: 24px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.note { font-size: 12.5px; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-size: 15px; margin: 0 0 4px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.panel h2 small { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between; margin-bottom: 10px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 18px; }
.grid2.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.chart-box { position: relative; height: 280px; }
.chart-box.sm { height: 220px; }
.chart-box.tall { height: 340px; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .lbl { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.kpi .src { font-size: 10px; letter-spacing: .06em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.kpi .val { font-family: var(--font-num); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.25; }
.kpi .val small { font-size: 12px; color: var(--muted); margin-left: 2px; font-family: var(--font-body); }
.kpi .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 11px; padding: 1px 7px; border-radius: 99px; font-family: var(--font-num); white-space: nowrap; }
.chip.up { background: var(--good-soft); color: var(--good); }
.chip.down { background: var(--bad-soft); color: var(--bad); }
.chip.flat { background: var(--surface-2); color: var(--muted); }
.chip .k { font-family: var(--font-body); opacity: .75; margin-right: 3px; }
.spark { width: 100%; height: 30px; display: block; }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
thead th { font-size: 11.5px; color: var(--muted); font-weight: 500; background: var(--surface); }
tbody tr:hover td { background: var(--surface-2); }
td.num, th.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
tr.total td { font-weight: 700; background: var(--surface-2); }
td .bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--accent); vertical-align: middle; margin-right: 6px; opacity: .75; }
.pill { font-size: 11px; padding: 2px 8px; border-radius: 99px; display: inline-block; }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.ng { background: var(--bad-soft); color: var(--bad); }
.pill.wait { background: var(--warn-soft); color: var(--warn); }
.pill.off { background: var(--surface-2); color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-size: 13px; }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
:root[data-theme="dark"] .btn.primary { color: #0f1513; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0f1513; } }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.card-kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 13px; margin-top: 8px; }
.card-kv dt { color: var(--muted); }
.card-kv dd { margin: 0; overflow-wrap: anywhere; }
.drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 18px; text-align: center; color: var(--muted); font-size: 13px; }
.progress { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; min-width: 80px; }
.progress span { display: block; height: 100%; background: var(--accent); }
.progress span.over { background: var(--good); }
.progress span.under { background: var(--warn); }
.legend-inline { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend-inline i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

.modal-back { position: fixed; inset: 0; background: rgba(10, 20, 16, .5); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal { background: var(--surface); border-radius: 14px; width: min(640px, 100%); max-height: 90vh; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
.modal h2 { font-family: var(--font-display); margin: 0; font-size: 18px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.form-grid label.full { grid-column: 1 / -1; }
.form-grid input, .form-grid select, .form-grid textarea { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: 13px; color: var(--fg); font-family: var(--font-body); }
.test-result { font-size: 12.5px; display: flex; flex-direction: column; gap: 4px; }

.login { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; padding: 16px; z-index: 30; }
.login-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px; width: min(400px, 100%); display: flex; flex-direction: column; gap: 14px; }
.login-card h1 { font-family: var(--font-display); font-size: 22px; margin: 0; }
.login-card label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.login-card input { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font-size: 14px; color: var(--fg); }

.kpis.wide { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.dash-switch { display: flex; flex-direction: column; gap: 4px; padding-inline: 4px; }
.dash-switch label { font-size: 10.5px; letter-spacing: .14em; opacity: .55; padding-inline: 4px; }
.dash-switch select { background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 7px 8px; font-size: 13px; font-family: var(--font-display); }
.dash-switch select option { color: #17211d; background: #fff; }
.tilemap { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 3px; max-width: 520px; }
.tile { aspect-ratio: 1; border-radius: 4px; font-size: 9.5px; display: grid; place-items: center; text-align: center; line-height: 1.1; color: var(--fg); background: var(--surface-2); max-width: 100%; overflow: hidden; }
.tile.hot { color: #fff; }
.scale { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.scale i { width: 90px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--surface-2), var(--accent)); display: inline-block; }
.pipeline { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.pipeline div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.pipeline b { font-family: var(--font-num); font-size: 18px; font-weight: 500; }
.pipeline span { font-size: 11.5px; color: var(--muted); }
.placeholder { display: grid; place-items: center; text-align: center; padding-block: 48px; gap: 10px; }
.placeholder ul { text-align: left; color: var(--muted); font-size: 13px; }
@media (max-width: 1400px) { .kpis.wide { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 1100px) {
  .kpis, .kpis.wide { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pipeline { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2, .grid2.even, .cards { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .nav { position: static; height: auto; flex-direction: row; overflow-x: auto; padding-inline: 16px; gap: 14px; align-items: flex-start; }
  .nav ul { flex-direction: row; }
  .nav button { white-space: nowrap; }
  .nav h3, .nav-foot, .brand span { display: none; }
  .topbar, .content { padding-inline: 16px; }
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  .kpis, .kpis.wide { grid-template-columns: minmax(0, 1fr); }
  .dash-switch { min-width: 180px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
(() => {
'use strict';

// ---------- 乱数（毎回同じダミーデータにする） ----------
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- メディア定義（base = 月間PVの目安） ----------
const MEDIA = [
  { id: 'seikatsu', name: '生活お助け本舗', base: 900, season: 'flat' },
  { id: 'gaiju', name: '害獣お助け本舗', base: 6900, season: 'spring' },
  { id: 'hachi', name: 'ハチお助け本舗', base: 46000, season: 'summer' },
  { id: 'mizu', name: '水まわりお助け本舗', base: 21000, season: 'winter' },
  { id: 'kagi', name: 'カギお助け本舗', base: 11700, season: 'flat' },
  { id: 'glass', name: 'ガラスお助け本舗', base: 17900, season: 'flat' },
  { id: 'roof', name: '屋根外壁お助け本舗', base: 700, season: 'flat' },
  { id: 'shiroari', name: 'シロアリお助け本舗', base: 11200, season: 'spring' },
  { id: 'best365', name: 'BEST365', base: 3200, season: 'flat' },
  { id: 'concierge', name: '害虫害獣コンシェルジュ', base: 10900, season: 'summer' },
];
const DIRS = [
  { id: 'c-gaichu', parent: 'concierge', name: '害虫', group: true, kids: ['c-cockroach', 'c-termite', 'c-wasp', 'c-other-i'] },
  { id: 'c-cockroach', parent: 'concierge', name: 'ゴキブリ', share: .006 },
  { id: 'c-termite', parent: 'concierge', name: 'シロアリ', share: .004 },
  { id: 'c-wasp', parent: 'concierge', name: 'ハチ', share: .29 },
  { id: 'c-other-i', parent: 'concierge', name: 'その他害虫', share: .002 },
  { id: 'c-gaiju', parent: 'concierge', name: '害獣', group: true, kids: ['c-bat', 'c-rat', 'c-other-a'] },
  { id: 'c-bat', parent: 'concierge', name: 'コウモリ', share: .54 },
  { id: 'c-rat', parent: 'concierge', name: 'ネズミ', share: .042 },
  { id: 'c-other-a', parent: 'concierge', name: 'その他害獣', share: .085 },
];
const ALL = 'all';

// ---------- 日付 ----------
const DAY = 86400000;
const START = Date.UTC(2024, 8, 1);         // 2024-09-01
const END = Date.UTC(2026, 9, 7);           // 2026-10-07（昨日まで収集済み）
const NDAYS = Math.round((END - START) / DAY) + 1;
const iso = i => new Date(START + i * DAY).toISOString().slice(0, 10);

function seasonFactor(kind, month) {
  if (kind === 'summer') return 0.55 + 0.9 * Math.exp(-Math.pow((month - 8) / 1.9, 2));
  if (kind === 'spring') return 0.8 + 0.45 * Math.exp(-Math.pow((month - 5) / 1.6, 2));
  if (kind === 'winter') return 0.85 + 0.35 * Math.exp(-Math.pow(((month + 5) % 12 - 6) / 1.5, 2));
  return 1;
}
const DATA = {};   // id -> { pv:[], sessions:[], ... } 日次の生値
function genMedia(m, idx) {
  const r = rng(1000 + idx * 77);
  const keys = ['pv', 'sessions', 'users', 'active', 'newUsers', 'engSum', 'call', 'form', 'imp', 'clicks', 'posSum', 'kCalls', 'visits', 'contracts', 'revenue',
    'ch_os', 'ch_direct', 'ch_ref', 'ch_social', 'ch_ai', 'ch_other', 'posts', 'rewrites'];
  const d = {}; keys.forEach(k => d[k] = new Float64Array(NDAYS));
  for (let i = 0; i < NDAYS; i++) {
    const dt = new Date(START + i * DAY);
    const growth = 0.62 + 0.38 * (i / NDAYS) + (m.id === 'concierge' ? 0.5 * (i / NDAYS) : 0);
    const wd = [0.88, 1.05, 1.04, 1.02, 1.0, 0.97, 0.9][dt.getUTCDay()];
    const pv = Math.max(0, Math.round(m.base / 30 * seasonFactor(m.season, dt.getUTCMonth() + 1) * growth * wd * (0.85 + r() * 0.3)));
    const ses = Math.round(pv * (0.84 + r() * 0.06));
    const users = Math.round(ses * (0.86 + r() * 0.05));
    d.pv[i] = pv; d.sessions[i] = ses; d.users[i] = users; d.active[i] = Math.round(users * 0.994); d.newUsers[i] = Math.round(users * (0.96 + r() * 0.03));
    d.engSum[i] = ses * (55 + r() * 40);
    const aiShare = i > NDAYS - 160 ? 0.002 + r() * 0.004 : 0;
    d.ch_os[i] = Math.round(pv * (0.84 + r() * 0.05)); d.ch_direct[i] = Math.round(pv * 0.09); d.ch_ref[i] = Math.round(pv * 0.025);
    d.ch_social[i] = Math.round(pv * 0.002); d.ch_ai[i] = Math.round(pv * aiShare); d.ch_other[i] = Math.max(0, pv - d.ch_os[i] - d.ch_direct[i] - d.ch_ref[i] - d.ch_social[i] - d.ch_ai[i]);
    const callRate = 0.0055 + r() * 0.002;
    d.call[i] = Math.round(pv * callRate + (r() < 0.3 ? 1 : 0)); d.form[i] = r() < pv / 9000 ? 1 : 0;
    const imp = Math.round(pv * (26 + r() * 10)); d.imp[i] = imp; d.clicks[i] = Math.round(imp * (0.009 + r() * 0.004));
    d.posSum[i] = imp * (5 + r() * 3 + (m.id === 'best365' ? 8 : 0));
    d.kCalls[i] = r() < (pv / 3000) ? 1 : 0; d.visits[i] = d.kCalls[i] && r() < 0.6 ? 1 : 0; d.contracts[i] = d.visits[i] && r() < 0.5 ? 1 : 0;
    d.revenue[i] = d.contracts[i] ? Math.round(18000 + r() * 40000) : (r() < 0.05 ? Math.round(r() * 2000) : 0);
    const postRate = m.base > 20000 ? 0.32 : m.base > 5000 ? 0.24 : 0.12;
    d.posts[i] = dt.getUTCDay() % 6 && r() < postRate ? 1 : 0;
    d.rewrites[i] = r() < postRate * 0.25 ? 1 : 0;
  }
  DATA[m.id] = d;
}

function leafIds(id) {
  if (id === ALL) return MEDIA.map(m => m.id);
  const g = DIRS.find(x => x.id === id && x.group);
  return g ? g.kids : [id];
}
function agg(id, s, e) {
  const ids = leafIds(id), t = {};
  const sum = k => { let v = 0; ids.forEach(x => { const a = DATA[x][k]; for (let i = s; i <= e; i++) v += a[i]; }); return v; };
  ['pv', 'sessions', 'users', 'active', 'newUsers', 'call', 'form', 'imp', 'clicks', 'kCalls', 'visits', 'contracts', 'revenue', 'ch_os', 'ch_direct', 'ch_ref', 'ch_social', 'ch_ai', 'ch_other', 'posts', 'rewrites'].forEach(k => t[k] = sum(k));
  t.cv = t.call + t.form;
  t.cvr = t.sessions ? t.cv / t.sessions : 0;
  t.vpa = t.active ? t.pv / t.active : 0;
  t.eng = t.sessions ? Math.floor(sum('engSum') / t.sessions) : 0;
  t.ctr = t.imp ? t.clicks / t.imp : 0;
  t.pos = t.imp ? sum('posSum') / t.imp : 0;
  return t;
}
const aggMonth = (id, key) => { const [s, e] = monthSpan(key); return agg(id, s, e); };

function fmt(k, v) {

  if (f === 'dec1') return v.toFixed(1);
  if (f === 'dec2') return v.toFixed(2);
  if (f === 'yen') return '¥' + nf.format(Math.round(v));
  return nf.format(Math.round(v));
}
function rate(a, b) { return b ? (a - b) / b : null; }
function chip(k, cur, prev, label) {
  const r = rate(cur, prev);
  if (r === null) return `<span class="chip flat"><span class="k">${label}</span>—</span>`;
  const better = M[k] && M[k].lowerBetter ? r < 0 : r > 0;
  const cls = Math.abs(r) < 0.005 ? 'flat' : better ? 'up' : 'down';
  return `<span class="chip ${cls}"><span class="k">${label}</span>${r > 0 ? '▲' : r < 0 ? '▼' : ''}${Math.abs(r * 100).toFixed(1)}%</span>`;
}
function rateCell(k, cur, prev) {
  const r = rate(cur, prev);
  if (r === null) return '<td class="num">—</td>';
  const better = M[k] && M[k].lowerBetter ? r < 0 : r > 0;
  const cls = Math.abs(r) < 0.005 ? 'flat' : better ? 'up' : 'down';
  return `<td class="num"><span class="chip ${cls}">${r > 0 ? '+' : ''}${(r * 100).toFixed(1)}%</span></td>`;
}
function spark(vals) {
  const w = 160, h = 30, mx = Math.max(...vals), mn = Math.min(...vals), sp = mx - mn || 1;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * w, h - 3 - (v - mn) / sp * (h - 6)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${w} ${h} L0 ${h} Z" fill="var(--accent-soft)" stroke="none"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="var(--accent)"/></svg>`;
}

  const seg = `<div class="seg" role="group" aria-label="エリアの指標">${AREA_METRICS.map(a => `<button type="button" data-am="${a[0]}" aria-pressed="${a[0] === k}">${a[1]}</button>`).join('')}</div>`;
  const controls = `<div class="row">${monthPicker()}${seg}<span class="note">地域はGA4の「地域」、成約はkintoneの案件住所から集計</span></div>`;
  const bind = () => { bindMonthPicker(); document.querySelectorAll('[data-am]').forEach(b => b.onclick = () => { state.areaMetric = b.dataset.am; render(); }); };
  if (state.mode === 'compare') {
    const ids = compareTargets(), totalRows = areaRows(ALL, s, e).sort((a, b) => b[k] - a[k]).slice(0, 10);
    const cells = ids.map(id => { const rows = areaRows(id, s, e), tot = rows.reduce((a, x) => a + x.sessions, 0); return { id, rows: Object.fromEntries(rows.map(x => [x.pref, x])), tot }; });
    return { html: controls + `<section class="panel"><h2>メディア別 エリア構成 <small>${mLabel(mm)}・全体の上位10都道府県のセッション構成比</small></h2><div class="table-wrap"><table><thead><tr><th>メディア</th>${totalRows.map(x => `<th class="num">${x.pref}</th>`).join('')}</tr></thead><tbody>

  }
  const rows = areaRows(state.media, s, e), prev = Object.fromEntries(areaRows(state.media, ps, pe).map(x => [x.pref, x]));

// ---------- モーダル ----------
function openModal(inner) { const m = document.getElementById('modal'); m.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${inner}</div>`; m.hidden = false; m.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal); m.onclick = ev => { if (ev.target === m) closeModal(); }; }
function closeModal() { const m = document.getElementById('modal'); m.hidden = true; m.innerHTML = ''; }

// ---------- 描画 ----------
const RENDER = { summary: viewSummary, monthly: viewMonthly, daily: viewDaily, yoy: () => viewPeriodCompare('yoy'), mom: () => viewPeriodCompare('mom'), range: viewRange,
  area: viewArea, articles: viewArticles, kw: viewKw, plan: viewPlan,
  users: viewUsers, logs: viewLogs, media: viewMedia, api: viewApi, jobs: viewJobs };
REVENUE_VIEWS.forEach(v => { RENDER[v.id] = viewRevenue; });
function render() {
  const adminIds = ADMIN_VIEWS.map(v => v.id), dashIds = (state.dash === 'revenue' ? REVENUE_VIEWS : VIEWS).map(v => v.id);
  if (!dashIds.includes(state.view) && !(state.role === 'admin' && adminIds.includes(state.view))) state.view = dashIds[0];
  if (state.role !== 'admin' && adminIds.includes(state.view)) state.view = dashIds[0];
  const isAnalysis = ANALYSIS_IDS.includes(state.view);
  const all = VIEWS.concat(ADMIN_VIEWS, REVENUE_VIEWS);
  document.getElementById('page-title').textContent = all.find(v => v.id === state.view).l;
  document.getElementById('media-field').hidden = !isAnalysis || state.mode === 'compare';
  document.getElementById('mode-seg').hidden = !isAnalysis;
  document.querySelectorAll('#mode-seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)));
  document.querySelectorAll('#role-seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.role === state.role)));
  document.getElementById('user-name').textContent = state.role === 'admin' ? '管理者ユーザー' : '一般ユーザー';
  document.querySelector('.avatar').textContent = state.role === 'admin' ? '管' : '一';
  document.getElementById('media-select').value = state.media;
  renderNav();
  clearCharts();
  const v = RENDER[state.view]();
  document.getElementById('content').innerHTML = v.html;
  v.after();
  save();
}

document.getElementById('nav-analysis').addEventListener('click', ev => { const b = ev.target.closest('button[data-view]'); if (b) { state.view = b.dataset.view; render(); } });
document.getElementById('nav-admin').addEventListener('click', ev => { const b = ev.target.closest('button[data-view]'); if (b) { state.view = b.dataset.view; render(); } });
document.getElementById('media-select').onchange = ev => { state.media = ev.target.value; render(); };
document.getElementById('dash-select').onchange = ev => { state.dash = ev.target.value; state.view = (state.dash === 'revenue' ? REVENUE_VIEWS : VIEWS)[0].id; render(); };
document.querySelectorAll('#mode-seg button').forEach(b => b.onclick = () => { state.mode = b.dataset.mode; render(); });
document.querySelectorAll('#role-seg button').forEach(b => b.onclick = () => { state.role = b.dataset.role; render(); });
document.getElementById('logout').onclick = () => { document.getElementById('login').hidden = false; };
document.getElementById('login-form').onsubmit = ev => { ev.preventDefault(); document.getElementById('login').hidden = true; };
document.getElementById('login-google').onclick = () => { document.getElementById('login').hidden = true; };
document.getElementById('login-register').onclick = () => {
  document.getElementById('login').hidden = true;
  openModal(`<h2>新規登録</h2><div class="form-grid"><label>名前<input id="rg-name"></label><label>メールアドレス<input id="rg-mail" type="email"></label><label class="full">パスワード<input id="rg-pass" type="password"></label></div><p class="note">登録後、管理者が承認するとログインできるようになります。</p><div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-close>閉じる</button><button class="btn primary" type="button" data-close>登録を申請する（試作）</button></div>`);
};
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render());
new MutationObserver(() => render()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

renderMediaSelect();
render();
})();
</script>
